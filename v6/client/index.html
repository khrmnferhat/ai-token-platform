<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sardis</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">S</span><span>Sardis</span></div><button class="new-chat" id="newChat">+ Yeni konuşma</button><div class="history-label">Konuşmalar</div><nav id="history"></nav><div class="sidebar-foot"><span class="dot"></span><span id="status">Bağlanıyor…</span></div></aside><main class="main"><header class="topbar"><button class="menu" id="menu" aria-label="Menü">☰</button><div><strong>Sardis</strong><small>Seninle düşünen kişisel asistan</small></div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><div class="welcome-mark">S</div><h1>Merhaba, ben Sardis.</h1><p>Merak ettiğin her şeyi birlikte düşünelim.</p><div class="suggestions"><button>Hava durumu nasıl?</button><button>Bir projeyi hatırlamamı ister misin?</button><button>Euro kuru bugün kaç?</button></div></div></section><form class="composer" id="composer"><textarea id="input" rows="1" placeholder="Sardis'e bir şey yaz..." autocomplete="off"></textarea><button type="submit" id="send" aria-label="Gönder">↑</button></form><div class="hint">Sardis hata yapabilir. Önemli kararları doğrulat.</div></main></div><script src="/app.js"></script></body></html>
