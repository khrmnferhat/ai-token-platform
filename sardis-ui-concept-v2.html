<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sardis — Personal Intelligence OS · Concept V2</title>
<style>
/* =========================================================
   SARDIS GLOBAL UI — CONCEPT V2
   Minimal · Intelligence-first · Single viewport
   Not the active index.html — standalone design concept.
   Palette: ~85% near-black · ~10% soft white/gray · ~5% gold
   ========================================================= */
:root{
  --bg:#08080a;--bg-2:#0b0b0d;--surface:#101013;--surface-2:#16161a;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --white:#f7f7f8;--soft:#b9b9c0;--muted:#85858d;
  --gold:#c9a857;--gold-bright:#e0c378;--gold-soft:rgba(201,168,87,.10);
  --radius:14px;--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;flex-direction:column}
::selection{background:var(--gold-soft);color:var(--gold-bright)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* NAV */
.nav{position:fixed;inset:0 0 auto 0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(8,8,10,.62);border-bottom:1px solid var(--line)}
.nav-inner{width:min(1100px,94%);margin:0 auto;display:flex;align-items:center;gap:26px;padding:17px 0}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;background:linear-gradient(135deg,var(--surface-2),#0a0a0c)}
.brand .eco{display:flex;flex-direction:column;line-height:1.15}
.brand .eco-top{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.brand .eco-main{font-size:16.5px;font-weight:640;letter-spacing:.04em;display:flex;align-items:baseline;gap:7px}
.brand .eco-main .sardis{color:var(--white)}
.brand .eco-main .sep{color:var(--muted);font-weight:300;font-size:13px}
.brand .eco-main .sardium{color:var(--muted);font-weight:500}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.lang{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer;border:1px solid transparent;padding:6px 10px;border-radius:8px;transition:.25s}
.lang:hover{border-color:var(--line);color:var(--white)}
.lang svg{width:14px;height:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:540;font-size:14px;transition:transform .3s var(--ease),background .3s,border-color .3s,color .3s;cursor:pointer;white-space:nowrap}
.btn-ghost{border:1px solid var(--line-2);color:var(--white)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-bright);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#0a0a0a}
.btn-gold:hover{background:var(--gold-bright);transform:translateY(-1px)}
.menu-btn{display:none;background:none;border:1px solid var(--line-2);border-radius:9px;color:#fff;width:40px;height:40px;font-size:18px;cursor:pointer}
<!-- ::SENT:: -->
