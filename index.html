<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sardis AI — Global Premium Assistant</title>

<meta
    name="description"
    content="Sardis AI — Global premium AI assistant"
>

<link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='bold' fill='%23d4af37' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
>

<meta
    name="theme-color"
    content="#000000"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --black: #000000;
    --panel: #0e0e11;
    --panel-2: #131318;

    --gold-dark: #8a6a16;
    --gold: #c9a857;
    --gold-main: #c9a857;
    --gold-light: #e0c378;
    --gold-soft: #dfc35b;

    --text: #f5f5f4;
    --text-soft: #c6c6cc;
    --muted: #8a8a92;

    --border: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.14);

    --bg: #08080a;
    --surface-1: #0e0e11;
    --surface-2: #131318;
    --elevated: #17171c;
    --accent: #c9a857;

    --sidebar-width: 255px;
    --content-width: 760px;
}

html,
body {
    width: 100%;
    height: 100%;
}

html {
    color-scheme: dark;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);
    background: #08080a;

    overflow: hidden;
}

button,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 2px solid rgba(212,175,55,.45);
    outline-offset: 2px;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: var(--sidebar-width);
    height: 100%;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            #0a0a0d 0%,
            #08080a 100%
        );

    border-right:
        1px solid rgba(255,255,255,.07);

    z-index: 20;
}

.brand {
    height: 82px;

    padding: 0 22px;

    display: flex;
    align-items: center;

    gap: 12px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.brand-logo {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
}

.brand-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    /* PNG gövdesine gömülü siyah zeminin kesin kaldırılması:
       luminance mask -> siyah(0)=şeffaf, altın(parlak)=opak.
       logo.png hem görsel hem kendi mask'i; her piksel aynı oranda
       örtüştüğü için yalnızca altın "S" görünür, boyut/konum aynı kalır. */
    -webkit-mask-image:
        url("logo.png");
    -webkit-mask-size:
        contain;
    -webkit-mask-position:
        center;
    -webkit-mask-repeat:
        no-repeat;
    -webkit-mask-mode:
        luminance;

    mask-image:
        url("logo.png");
    mask-size:
        contain;
    mask-position:
        center;
    mask-repeat:
        no-repeat;
    mask-mode:
        luminance;

    display: block;
}

.brand-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.3px;

    color: #eee9dc;
}

.brand-subtitle {
    margin-top: 2px;

    color: #a98c3e;

    font-size: 10px;
    letter-spacing: 1.4px;

    font-weight: 600;
}

.new-chat {
    margin: 18px;

    height: 44px;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 10px;

    color: #c6c6cc;

    background:
        rgba(255,255,255,.03);

    font-size: 13px;
    font-weight: 600;

    transition:
        background .2s,
        border-color .2s,
        color .2s,
        box-shadow .2s,
        transform .2s;
}

.new-chat:hover {
    color: #f5f5f4;

    border-color:
        rgba(255,255,255,.20);

    background:
        rgba(255,255,255,.05);

    box-shadow:
        0 8px 25px rgba(0,0,0,.28);

    transform: translateY(-1px);
}

.sidebar-section {
    padding:
        6px 18px 8px;

    color: #7d7d85;

    font-size: 11px;
    font-weight: 600;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.chat-list {
    flex: 1;

    padding: 4px 10px;

    overflow-y: auto;
}

.chat-list::-webkit-scrollbar,
.chat::-webkit-scrollbar {
    width: 5px;
}

.chat-list::-webkit-scrollbar-thumb,
.chat::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.14);
    border-radius: 999px;
}

.empty-history {
    padding: 25px 10px;

    text-align: center;

    color: #55534d;

    font-size: 12px;

    line-height: 1.6;
}

.history-item {
    width: 100%;

    padding: 10px 11px;

    margin-bottom: 3px;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color: #a0a0a8;

    text-align: left;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 12px;

    transition:
        background .15s,
        color .15s;
}

.history-item:hover {
    background:
        rgba(255,255,255,.045);

    color: #e0e0e6;
}

.history-item.active {
    background:
        rgba(201,168,87,.10);

    color: #e0c378;
}

.sidebar-bottom {
    padding: 15px 18px;

    border-top:
        1px solid rgba(255,255,255,.06);
}

.system-status {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #716e67;

    font-size: 10px;
}

.status-dot {
    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #c9a227;

    box-shadow:
        0 0 6px rgba(212,175,55,.4);
}

.status-dot.offline {
    background: #8b2929;
    box-shadow: none;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    min-width: 0;

    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    position: relative;

    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(201,168,87,.035),
            transparent 40%
        ),
        #08080a;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 26px;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(8,8,10,.86);

    /* backdrop-filter kaldırıldı: arkasında sürekli hareket eden
       aurora katmanları yüzünden her karede yeniden blur hesaplanıyor
       ve yazma gecikmesine neden oluyordu. bg zaten %94 opak. */

    z-index: 10;
}

.header-title {
    display: flex;

    align-items: center;

    gap: 10px;
}

.header-title strong {
    color: #eee9dc;

    font-size: 14px;

    font-weight: 650;
}

.online-badge {
    display: flex;

    align-items: center;

    gap: 6px;

    padding: 4px 8px;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 999px;

    color: #e0c378;

    background:
        rgba(212,175,55,.035);

    font-size: 9px;
}

.online-badge .status-dot {
    width: 5px;
    height: 5px;
}

.header-right {
    display: flex;

    align-items: center;

    gap: 10px;
}

.language-select {
    margin-left: auto;

    max-width: 190px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 8px;

    background: #0e0e11;

    color: #bdbdc4;

    padding: 6px 8px;

    font-size: 10px;

    outline: none;

    cursor: pointer;
}

.language-select:focus {
    border-color:
        rgba(212,175,55,.4);

    box-shadow:
        0 0 0 2px rgba(212,175,55,.05);
}

.model-badge {
    color: #9b8a5c;

    font-size: 10px;

    letter-spacing: .16em;

    text-transform: uppercase;

    white-space: nowrap;
}

.model-badge::before {
    content: "";

    display: inline-block;

    width: 4px;

    height: 4px;

    margin-right: 7px;

    border-radius: 50%;

    background: #d4af37;

    vertical-align: 1px;
}

.mobile-menu {
    display: none;

    border: 0;

    background: transparent;

    color: #bdbdc4;

    font-size: 21px;
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;

    overflow-y: auto;

    scroll-behavior: smooth;

    background:
        radial-gradient(
            circle at 50% 28%,
            rgba(201,168,87,.016),
            transparent 42%
        );
}

body:not(.chat-active) .chat {
    flex: 0 0 auto;
}

.chat-inner {
    width:
        min(
            var(--content-width),
            calc(100% - 40px)
        );

    margin: 0 auto;

    padding:
        35px 0 190px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    padding-top: clamp(32px, 9vh, 108px);

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.welcome-logo {
    width: 104px;
    height: 104px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 30px;

    background: transparent;
}

.welcome-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    /* PNG gövdesine gömülü siyah zeminin kesin kaldırılması:
       luminance mask -> siyah(0)=şeffaf, altın(parlak)=opak. */
    -webkit-mask-image:
        url("logo.png");
    -webkit-mask-size:
        contain;
    -webkit-mask-position:
        center;
    -webkit-mask-repeat:
        no-repeat;
    -webkit-mask-mode:
        luminance;

    mask-image:
        url("logo.png");
    mask-size:
        contain;
    mask-position:
        center;
    mask-repeat:
        no-repeat;
    mask-mode:
        luminance;

    /* Maskeli logo şeklini takip eden yumuşak altın hale:
       premium derinlik, görünür çerçeve yok. */
    filter:
        drop-shadow(0 10px 38px rgba(201,168,87,.16))
        drop-shadow(0 2px 10px rgba(0,0,0,.6));

    display: block;
}

.welcome h1 {
    margin-bottom: 16px;

    color: #f3f1ec;

    font-size:
        clamp(34px,5vw,50px);

    font-weight: 650;

    letter-spacing: -1.2px;

    background:
        linear-gradient(
            180deg,
            #fbf9f3 30%,
            #c9c3b2 100%
        );

    -webkit-background-clip: text;

    background-clip: text;

    -webkit-text-fill-color: transparent;
}

.welcome p {
    max-width: 600px;

    padding: 0 24px;

    color: #c6c6cc;

    font-size: 16px;

    line-height: 1.7;
}

/* =========================================================
   MESSAGE
========================================================= */

.message {
    display: flex;

    gap: 16px;

    margin-bottom: 30px;

    animation:
        messageIn .2s ease-out;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 9px;

    font-size: 11px;

    font-weight: 800;
}

.avatar.ai {
    overflow: hidden;

    background: transparent;
}

.avatar.ai img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    /* PNG gövdesine gömülü siyah zeminin kesin kaldırılması:
       luminance mask -> siyah(0)=şeffaf, altın(parlak)=opak. */
    -webkit-mask-image:
        url("logo.png");
    -webkit-mask-size:
        contain;
    -webkit-mask-position:
        center;
    -webkit-mask-repeat:
        no-repeat;
    -webkit-mask-mode:
        luminance;

    mask-image:
        url("logo.png");
    mask-size:
        contain;
    mask-position:
        center;
    mask-repeat:
        no-repeat;
    mask-mode:
        luminance;
}

.avatar.user {
    color: #c8c2b3;

    background: #11100c;

    border:
        1px solid rgba(255,255,255,.07);
}

.message-body {
    min-width: 0;

    max-width: 82%;
}

.message.user .message-body {
    max-width: 78%;
}

.message-content {
    padding:
        16px 20px;

    border-radius: 14px;

    font-size: 15px;

    line-height: 1.75;

    white-space: pre-wrap;

    word-break: break-word;
}

.message.ai .message-content {
    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.07);

    color: #e8e8ea;

    letter-spacing: .1px;
}

.message.user .message-content {
    background:
        linear-gradient(
            135deg,
            #18181c,
            #131317
        );

    border:
        1px solid rgba(255,255,255,.07);

    color: #dcdce2;
}

.message-meta {
    margin-top: 8px;

    padding: 0 4px;

    display: flex;

    align-items: center;

    gap: 12px;

    color: #6f6f76;

    font-size: 11px;
}

.message.user .message-meta {
    justify-content: flex-end;
}

.copy-btn {
    border: 0;

    background: transparent;

    color: #6f6f76;

    font-size: 11px;

    transition: color .15s;
}

.copy-btn:hover {
    color: #e0c378;
}

/* =========================================================
   SOURCES
========================================================= */

.sources {
    margin-top: 12px;

    padding: 12px;

    border:
        1px solid rgba(255,255,255,.07);

    border-radius: 10px;

    background:
        rgba(255,255,255,.02);
}

.sources-title {
    margin-bottom: 7px;

    color: #c9a227;

    font-size: 10px;

    font-weight: 700;
}

.source {
    display: block;

    padding: 7px 0;

    border-bottom:
        1px solid rgba(255,255,255,.035);

    color: #8f8f96;

    text-decoration: none;

    font-size: 11px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    transition: color .15s;
}

.source:last-child {
    border-bottom: 0;
}

.source:hover {
    color: #e0c378;
}

/* =========================================================
   TYPING
========================================================= */

.typing {
    display: flex;

    align-items: center;

    gap: 5px;

    padding: 14px 4px;
}

.typing span {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #c9a227;

    animation:
        typing 1.1s infinite ease-in-out;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

.typing svg {
    align-self: center;

    margin-right: 3px;

    opacity: .85;
}

@keyframes typing {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: .3;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* =========================================================
   COMPOSER
========================================================= */

/* WELCOME-mode layout: composer flows right under the
   greeting (premium hero composition). CHAT-mode restores
   the classic fixed bottom bar via body.chat-active. */
.composer-area {
    pointer-events: auto;

    width:
        min(
            640px,
            calc(100% - 48px)
        );

    margin: clamp(38px, 5vh, 58px) auto 0;
}

body.chat-active .composer-area {
    position: fixed;

    bottom: 0;

    left: var(--sidebar-width);

    right: 0;

    width: auto;

    margin: 0;

    padding:
        18px 25px 22px;

    background:
        linear-gradient(
            to top,
            #000000 55%,
            transparent
        );

    pointer-events: none;

    z-index: 15;
}

.composer {
    pointer-events: auto;

    width:
        min(
            var(--content-width),
            100%
        );

    margin: 0 auto;

    padding: 10px 12px 8px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 18px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,.015)
        ),
        #131318;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 24px 60px -28px rgba(0,0,0,.9);

    transition:
        border-color .25s,
        box-shadow .25s;
}

.composer:hover {
    border-color: rgba(255,255,255,.16);
}

.composer:focus-within {
    border-color: rgba(201,168,87,.42);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 0 3px rgba(201,168,87,.08),
        0 24px 60px -28px rgba(0,0,0,.9);
}

.input-row {
    display: flex;

    align-items: flex-end;

    gap: 8px;
}

#messageInput {
    width: 100%;

    min-height: 44px;

    max-height: 180px;

    resize: none;

    border: 0;

    outline: 0;

    background: transparent;

    color: #f0efe9;

    caret-color: #c9a857;

    padding:
        11px 14px;

    font-size: 16px;

    line-height: 1.55;
}

#messageInput::placeholder {
    color: #6d6d75;
}

#messageInput:disabled {
    opacity: .55;
}

.mic-btn {
    width: 40px;

    height: 40px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    background: transparent;

    color: #8f8f96;

    cursor: pointer;

    transition:
        background .2s,
        color .2s;
}

.mic-btn:hover {

    background:
        rgba(255,255,255,.06);

    color: #e8e8ea;
}

.mic-btn:focus-visible {

    outline:
        1px solid rgba(212,175,55,.55);

    outline-offset: 2px;
}

.mic-btn.listening {

    background:
        rgba(212,175,55,.10);

    color: #d9bc6a;
}

.mic-btn.listening svg {

    animation:
        micPulse 1.6s ease-in-out infinite;
}

@keyframes micPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .5;
    }
}

@media (prefers-reduced-motion: reduce) {

    .mic-btn.listening svg {
        animation: none;
    }
}

.mic-status {

    color: #d9bc6a;

    font-size: 11px;

    letter-spacing: .4px;
}

/* TTS V1 — per-message read-aloud button */
.tts-btn {
    width: 32px;

    height: 32px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    background: transparent;

    color: #8f8f96;

    cursor: pointer;

    padding: 0;

    transition:
        background .2s,
        color .2s;
}

.tts-btn svg {
    display: block;
}

.tts-btn:hover {
    background:
        rgba(255,255,255,.06);

    color: #e8e8ea;
}

.tts-btn:focus-visible {
    outline:
        1px solid rgba(212,175,55,.55);

    outline-offset: 2px;
}

.tts-btn.speaking {
    background:
        rgba(212,175,55,.10);

    color: #d9bc6a;
}

.tts-btn.speaking svg {
    animation:
        micPulse 1.6s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {

    .tts-btn.speaking svg {
        animation: none;
    }
}

@media (max-width: 800px) {

    .tts-btn {
        width: 44px;

        height: 44px;
    }
}

@media (max-width: 800px) {

    .mic-btn {
        width: 44px;

        height: 44px;
    }
}

.send-btn {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border: 1px solid rgba(201,168,87,.4);

    border-radius: 12px;

    color: #d9bc6a;

    font-size: 18px;

    font-weight: 600;

    background:
        linear-gradient(
            180deg,
            #141318,
            #0d0d10
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 20px -10px rgba(0,0,0,.85);

    transition:
        transform .15s,
        background .18s,
        border-color .18s,
        box-shadow .18s;
}

/* GERÇEK Sardis logosu (logo.png) — luminance mask ile gönder
   butonunda siyah zemin görünmez; ALTIN marka tonu (#d9bc6a→#c9a857)
   koyu buton yüzeyinde net öne çıkar. */
.send-logo {
    width: 26px;
    height: 26px;

    flex-shrink: 0;

    display: block;

    background:
        linear-gradient(
            180deg,
            #d9bc6a,
            #c9a857
        );

.ambient {

    z-index: 0;

    overflow: hidden;

    pointer-events: none;
}

.ambient::before,
.ambient::after {
    content: "";

    position: absolute;

    width: 52vw;
    height: 52vw;

    min-width: 460px;
    min-height: 460px;

    border-radius: 50%;

    /* Yumuşak ışık: pahalı filter: blur yerine geniş yayılımlı
       radial-gradient. Sıfır blur ve animasyon maliyeti — compositor'a
       yük bindirmez, yazma akıcılığını korur. */
}

.ambient::before {
    top: -20%;
    right: -14%;

    background:
        radial-gradient(
            circle at center,
            rgba(201,168,87,.07),
            transparent 60%
        );
}

.ambient::after {
    bottom: -26%;
    left: -16%;

/* ---------------------------------------------------------
   STATUS PULSE
--------------------------------------------------------- */

.status-dot:not(.offline) {
    position: relative;
}

/* Nefes alan halka: box-shadow interpolasyonu yerine yalnızca
   opacity animasyonu — tamamen compositor'da çalışır,
   ana thread'e paint yükü bindirmez. Görsel sonuç eşdeğer. */
.status-dot:not(.offline)::after {
    content: "";

    position: absolute;

    inset: -6px;

    border-radius: inherit;

    box-shadow:
        0 0 0 6px rgba(212,175,55,.09);

    opacity: 0;

    pointer-events: none;

    animation:
        dotPulse 2.6s ease-in-out infinite;
}

@keyframes dotPulse {

    0%,
    100% {
        opacity: 0;
    }

    50% {
        opacity: 1;
    }
}

   COMPOSER FOCUS GLOW + SEND SHEEN
--------------------------------------------------------- */

.composer {
    transition:
        border-color .18s,
        box-shadow .18s;

.composer:focus-within {
    border-color:
        rgba(201,168,87,.55);

}

    height: 100%;

            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transform: skewX(-18deg);

    transition:
        left .5s ease;

.send-btn:hover::after {

}

.send-btn:disabled::after {
    display: none;

    flex-direction: column;

    direction: ltr;

.activity-steps li {
    display: flex;
    align-items: center;
    gap: 9px;

    min-width: 0;

    padding: 4px 10px 4px 11px;

    color: #aebfb2;
    font-size: 11.5px;
    line-height: 1.45;

.activity-steps li span {
    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

.activity-steps li::before {
    content: "○";

    flex-shrink: 0;
    width: 12px;

    color: #55645a;
    font-family: ui-monospace, SFMono-Regular, Menlo,
        Consolas, monospace;
    font-size: 11px;
    text-align: center;
}

/* [●] active step — very soft breathing opacity only */
.activity-steps li.active {
    color: #dcebe0;
}

.activity-steps li.active::before {
    content: "●";
    color: #7fae8c;

    animation: actBreathe 1.9s ease-in-out infinite;
}

@keyframes actBreathe {
    0%, 100% { opacity: .5; }
    50%      { opacity: 1; }

/* [✓] completed */
.activity-steps li.done {
    color: #9caea0;
}

.activity-steps li.done::before {

<script>

"use strict";

/* =========================================================
   WORKING ACTIVITY CONTROLLER V1 (SARDIS 5.1.8)
   Injected below in three parts. See window.SardisActivity.
========================================================= */
window.SardisActivity = (function () {

    const panel =
        document.getElementById("activityPanel");

    const stepsEl =
        document.getElementById("activitySteps");

    const metaEl =
        document.getElementById("activityMeta");

    const sidebarEl =
        document.getElementById("sidebar");

    /* pendingSince = last sendMessage start tick;
       closedAt    = user's last explicit close tick.
       A close during a running task keeps the panel
       closed for that task; the NEXT real task may
       auto-open again. lastUserText feeds the PROGRAM
       FLOW detector (real user request, no guessing). */
    const state = {
        open: false,
        pendingSince: 0,
        closedAt: -1,
        lastUserText: ""
    };

    /* Decision modes that really execute backend tools */
    const TOOL_MODES = {
        weather: true,
        crypto: true,
        web: true,
        web_search: true,
        multi_tool: true,
        research: true,
        web_research: true,
        web_retry: true,
        web_research_no_evidence: true,
        claim_verification: true,
        numeric_claim_verification: true,
        verify_claims: true
    };

    /* Backend tool-id to human label */
    const TOOL_LABELS = {
        web_search: "Web search",
        web_reader: "Read page",
        weather: "Weather lookup",
        crypto: "Crypto lookup",
        memory: "Memory access"
    };

    /* Mode fallback when a trace step has no tools */
    const MODE_LABELS = {
        weather: "Weather lookup",
        crypto: "Crypto lookup",
        memory: "Memory access",
        web: "Web search",
        web_research: "Web search",
        web_retry: "Web search (retry)",
        multi_tool: "Multi-tool run",
        claim_verification: "Source verification",
        numeric_claim_verification: "Numeric verification",
        verify_claims: "Source verification",
        web_research_no_evidence: "Web search"
    };

    function humanize(raw) {

        return String(raw || "step")
            .replace(/_/g, " ")
            .replace(
                /\b\w/g,
                function (c) {
                    return c.toUpperCase();
                }
            );
    }

    /* ---- PROGRAM FLOW detection (V2) ---------------------
       Sardis is a chat app by default. The PROGRAM AKIŞI
       dock may mount ONLY for real programming / project
       tasks. Weather, crypto, web research, memory or claim
       runs must NEVER mount it (spec tests 6-8), and merely
       containing the word "kod" must not either.
       These functions are pure → extractable for testing. */

    /* AC-DETECT-BEGIN */

    /* Decision modes that execute generic tools — none of
       them is programming activity, so they veto mounting */
    const NON_CODE_MODES = TOOL_MODES;

    const CODE_FILE_RE =
        /\b[\w@.-]+\.(?:js|mjs|cjs|ts|jsx|tsx|py|html|htm|css|json|md|yml|yaml|sh|sql|toml)\b/i;

    const CODE_CTX_RE =
        /\b(kod[a-zıüöçş]*|code|coding|proje[a-zıüöçş]*|project|repo[a-zıüöçş]*|backend[ıi']*(?:n(?:de|un))?|front-?end|api|endpoint|fonksiyon(?:u)?|işlev(?:i)?|fonksiyon|modül(?:ü)?|module|script(?:'?i)?)\b/i;

    const CODE_ACT_RE =
        /\b(analiz|analyze|geliştir|gelistir|improve|refactor|refaktör|optimize|düzelt|duzelt|fix|debug|hata(?:s[ıi](?:n[ıi]))?|bug|test(?:i|leri)?|inspect|incele|oku|read|değiştir|degistir|modify|ekle|add|extend|migrate|kurulum|yapılandır|çalıştır|calistir|deploy)\b/i;

    /* Innocent questions that must stay plain chat even if
       some tokens collide ("python nedir", "kodlama kursu") */
    const CODE_VETO_RE =
        /\b(öğren(?:mek|iyor)?|öğret(?:mek)?|nedir|ne demek|kimdir|kurs(?:u|ları)?)\b/i;

    /* Spec-example imperative forms — direct strong signal */
    const CODE_SPECIFIC_RE =
        /(bug'?ı\s+(bul|düzelt)|hatayı\s+düzelt|analiz\s+et|(api|endpoint|fonksiyon|işlev)\s+(ekle|add)|projeyi\s+test|[ck]line\s+gibi)/i;

    function looksLikeCodingPrompt(text) {

        const t =
            String(text || "")
                .toLowerCase()
                .trim();

        if (t.length < 6) {
            return false;
        }

        if (CODE_VETO_RE.test(t)) {
            return false;
        }

        if (CODE_SPECIFIC_RE.test(t)) {
            return true;
        }

        if (
            CODE_FILE_RE.test(t) &&
            CODE_ACT_RE.test(t)
        ) {
            return true;
        }

        return CODE_CTX_RE.test(t) &&
               CODE_ACT_RE.test(t);
    }

    /* Real backend fields stay authoritative. Modes that provably
       ran a dedicated non-code tool (weather, crypto, web search,
       claim checks …) veto mounting. multi_tool is AMBIGUOUS — the
       planner may run web tools even on genuine coding tasks, so
       the user's real phrasing decides there instead of the mode
       alone; a non-coding prompt under multi_tool stays closed. */
    function shouldShowFlow(d, userText) {

        if (!d) {
            return false;
        }

        const dm =
            d.decision?.mode || d.mode || "";

        if (dm === "multi_tool") {
            return looksLikeCodingPrompt(userText);
        }

        if (typeof dm === "string" && NON_CODE_MODES[dm]) {
            return false;
        }

        return looksLikeCodingPrompt(userText);
    }

    /* AC-DETECT-END */

    /* ---- Trigger detection (real fields only) ----------- */

    function hasRealWork(d) {

        if (!d) {
            return false;
        }

        if (
            Array.isArray(d.agent?.steps) &&
            d.agent.steps.length > 0
        ) {
            return true;
        }

        if (d.webSearch === true) {
            return true;
        }

        if (
            Array.isArray(d.webResults) &&
            d.webResults.length > 0
        ) {
            return true;
        }

        if (
            Array.isArray(d.toolErrors) &&
            d.toolErrors.length > 0
        ) {
            return true;
        }

        if (d.claimValidation) {
            return true;
        }

        const dm =
            d.decision?.mode || d.mode;

        return typeof dm === "string" &&
               Boolean(TOOL_MODES[dm]);
    }

    /* Short echo of the real user request (row 1) */
    function shortCmd(text) {

        let s =
            String(text || "")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();

        if (s.length > 46) {
            s = s.slice(0, 45) + "…";
        }

        return s;
    }

    /* ---- Row builder -------------------------------------
       Every row maps to an actual backend fact. The response
       has fully arrived, so completed work is [✓]; real tool
       errors [!]; honestly missing evidence stays a note. */
    function buildRows(d) {

        const rows = [];

        /* Row 1 — the user's own, real instruction. This is
           genuine data (what was asked), never invented. */
        if (state.lastUserText) {
            rows.push({
                cls: "cmd",
                label: shortCmd(state.lastUserText)
            });
        }

        const trace =
            d.agent && Array.isArray(d.agent.steps)
                ? d.agent.steps.filter(
                    s => s &&
                    (
                        s.mode ||
                        s.tools ||
                        s.step
                    )
                )
                : [];

        trace.forEach(
            st => {

                const tools =
                    Array.isArray(st.tools) ? st.tools : [];

                const label =
                    tools.length > 0
                        ? tools.map(
                            tl =>
                            TOOL_LABELS[tl] || humanize(tl)
                        ).join(" + ")
                        : MODE_LABELS[st.mode] || humanize(st.mode);

                rows.push({
                    cls: "done",
                    label: label
                });
            }
        );

        if (trace.length === 0) {

            const dm =
                d.decision?.mode || d.mode;

            if (
                typeof dm === "string" &&
                MODE_LABELS[dm]
            ) {
                rows.push({
                    cls: "done",
                    label: MODE_LABELS[dm]
                });
            }
        }

        if (d.webResults?.length > 0) {

            rows.push({
                cls: "done",
                label:
                    "Sources gathered · " +
                    d.webResults.length
            });
        }
        else if (
            d.webSearch === true &&
            trace.length === 0
        ) {
            rows.push({
                cls: "pend",
                label: "No usable evidence"
            });
        }

        const cv = d.claimValidation;

        if (cv) {

            if (cv.verdict === "supported") {

                rows.push({
                    cls: "done",
                    label: "Verified by sources"
                });
            }
            else if (cv.verdict === "contradicted") {

                rows.push({
                    cls: "err",
                    label: "Contradicted by sources"
                });
            }
            else {

                rows.push({
                    cls: "pend",
                    label: "Verification inconclusive"
                });
            }
        }

        if (d.toolErrors?.length > 0) {

            rows.push({
                cls: "err",
                label:
                    "Tool errors · " +
                    d.toolErrors.length
            });
        }

        if (rows.length > 0) {

            rows.push({
                cls: "done",
                label: "Answer ready"
            });
        }

        return rows;
    }

    /* ---- Rendering --------------------------------------- */

    function renderRows(rows) {

        if (!stepsEl) {
            return;
        }

        stepsEl.textContent = "";

        rows.forEach(
            r => {

                const li =
                    document.createElement("li");

                li.className = r.cls;

                const span =
                    document.createElement("span");

                span.textContent = r.label;

                span.title = r.label;

                li.appendChild(span);

                stepsEl.appendChild(li);
            }
        );

        /* Terminal "last event" emphasis — real timing,
           not simulation: the last rendered fact. */
        const last = stepsEl.lastElementChild;

        if (last) {
            last.className = "active";
        }
    }

    function renderMeta(d) {

        if (!metaEl) {
            return;
        }

        /* Null-safe: plain-chat responses clear the meta line */
        if (!d || typeof d !== "object") {
            metaEl.textContent = "";
            metaEl.style.display = "none";
            return;
        }

        const parts = [];

        const dm =
            d.decision?.mode || d.mode;

        if (typeof dm === "string" && dm) {
            parts.push(dm);
        }

        if (Number.isFinite(d.responseTime)) {
            parts.push(
                Math.round(d.responseTime) + "ms"
            );
        }

        metaEl.textContent =
            parts.join(" · ");

        metaEl.style.display =
            parts.length ? "" : "none";
    }

    /* ---- SSE V1 live progress (auxiliary UI channel) -----
       Real backend phases (thinking/planning/searching/
       reading/generating/validating) render a TRANSIENT list
       into #activitySteps while a task is running. This never
       opens or closes the panel and never touches has-flow or
       shouldShowFlow(); handleChatData()/buildRows() remain
       the authoritative final render. While the panel is
       closed, live events are tracked in memory only. */

    const LIVE_PHASES = {
        thinking: "Thinking",
        planning: "Planning",
        searching: "Web search",
        reading: "Read page",
        generating: "Generating answer",
        validating: "Verifying claims"
    };

    const liveState = {
        phases: []
    };

    function liveRender() {

        if (!stepsEl || !state.open) {
            return;
        }

        stepsEl.textContent = "";

        if (state.lastUserText) {

            const cmd =
                document.createElement("li");

            cmd.className = "cmd";

            const cmdSpan =
                document.createElement("span");

            cmdSpan.textContent =
                shortCmd(state.lastUserText);

            cmdSpan.title = cmdSpan.textContent;

            cmd.appendChild(cmdSpan);

            stepsEl.appendChild(cmd);
        }

        liveState.phases.forEach(
            function (phase, index) {

                const li =
                    document.createElement("li");

                li.className =
                    index === liveState.phases.length - 1
                        ? "active"
                        : "done";

                const span =
                    document.createElement("span");

                span.textContent =
                    LIVE_PHASES[phase] || humanize(phase);

                span.title = span.textContent;

                li.appendChild(span);

                stepsEl.appendChild(li);
            }
        );
    }

    function livePhase(phase) {

        try {

            const key =
                String(phase || "");

            if (
                !key ||
                !LIVE_PHASES[key]
            ) {
                return;
            }

            if (
                liveState.phases[liveState.phases.length - 1] === key
            ) {
                return;
            }

            liveState.phases.push(key);

            if (liveState.phases.length > 8) {
                liveState.phases.shift();
            }

            liveRender();

        } catch (err) {

            /* live updates must never break chat */
        }
    }

    function liveReset() {

        /* Only the transient list is cleared; panel visibility
           and the authoritative final render stay untouched. */
        liveState.phases = [];
    }

    function setOpen(nextOpen) {

        state.open = nextOpen;

        if (!panel) {
            return;
        }

        panel.hidden =
            !nextOpen;

        panel.classList.toggle(
            "active",
            nextOpen
        );

        panel.setAttribute(
            "aria-hidden",
            String(!nextOpen)
        );

        /* 50/50 SIDEBAR SPLIT — mount/dismount the lower
           PROGRAM AKIŞI dock together with the flow state */
        if (sidebarEl) {
            sidebarEl.classList.toggle(
                "has-flow",
                nextOpen
            );
        }
    }

    /* ---- Task-aware open/dismiss behavior ---------------- */

    function notifySend(userText) {

        state.pendingSince =
            Date.now();

        state.lastUserText =
            String(userText || "").trim();
    }

    function handleChatData(d) {

        try {

            if (!panel) {
                return;
            }

            /* PROGRAM AKIŞI belongs ONLY to coding/project
               tasks. Plain chat, weather, crypto or web
               research responses hide the dock again (spec
               test 5: task ended → next "Merhaba" hides it). */
            if (
                !shouldShowFlow(d, state.lastUserText)
            ) {
                setOpen(false);

                state.pendingSince = 0;

                renderRows([]);

                renderMeta(null);

                return;
            }

            const rows =
                buildRows(d);

            if (rows.length === 0) {
                return;
            }

            renderRows(rows);

            renderMeta(d);

            const dismissedThisTask =
                state.closedAt >= state.pendingSince &&
                state.pendingSince > 0;

            if (dismissedThisTask) {

                /* Same-task preference kept; next task
                   may reopen on its own */
                state.closedAt = -1;
                return;
            }

            setOpen(true);
        }
        catch (err) {

            /* Activity rendering must never break chat */
            console.warn("[Sardis] activity error", err);
        }
    }

    function close(byUser) {

        setOpen(false);

        if (byUser) {
            state.closedAt =
                Date.now();
        }
    }

    function open() {
        setOpen(true);
    }

    /* ---- Close control ----------------------------------- */

    if (panel && document.getElementById("activityClose")) {

        const closeEl =
            document.getElementById("activityClose");

        closeEl.addEventListener(
            "click",
            function () {
                close(true);
            }
        );

        closeEl.addEventListener(
            "keydown",
            function (ev) {

                if (
                    ev.key === "Enter" ||
                    ev.key === " "
                ) {
                    ev.preventDefault();
                    close(true);
                }
            }
        );
    }

    /* ---- Public API -------------------------------------- */

    const api = {
        open: open,
        close: close,
        notifySend: notifySend,
        handleChatData: handleChatData,
        livePhase: livePhase,
        liveReset: liveReset,
        hasRealWork: hasRealWork,
        shouldShowFlow: shouldShowFlow,
        looksLikeCodingPrompt: looksLikeCodingPrompt,
        isOpen: function () {
            return state.open;
        }
    };

    /* Legacy global kept for compatibility */
    window.__SARDIS_ACTIVITY__ = api;

    return api;
})();

========================================================= */

function t(key) {

    return (
        UI[base]?.[key] ??
        UI.en[key] ??
        key
    );
}


/* =========================================================
   SAFE TEXT
========================================================= */

function safeText(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(value);
}


/* =========================================================
   LOCALE
========================================================= */

function setLocale(value) {

    locale =
        value ||
        "en-US";

    base =
        locale
            .toLowerCase()
            .split("-")[0];

    if (
        !UI[base] &&
        !EXTRA_LANGUAGES[base]
    ) {

        base = "en";
    }

    localStorage.setItem(
        "sardis_language",
        locale
    );

    document.documentElement.lang =
        locale;

    document.documentElement.dir =
        RTL_LANGUAGES.has(base)
            ? "rtl"
            : "ltr";

    newChatBtn.textContent =
        t("newChat");

    document.getElementById(
        "chatsLabel"
    ).textContent =
        t("chats");

    const welcomeText =
        document.getElementById(
            "welcomeText"
        );

    if (welcomeText) {

        welcomeText.textContent =
            t("welcome");
    }

    input.placeholder =
        t("placeholder");

    document.getElementById(
        "onlineText"
    ).textContent =
        t("online");

    modelBadge.textContent =
        "Sardium Ecosystem";

    renderHistory();

    languageSelect.value =
        base;
}


/* =========================================================
   LANGUAGE LIST
========================================================= */

function buildLanguageList() {

    const languages =
        new Map();

    Object.keys(UI)
        .forEach(
            code => {

                languages.set(
                    code,
                    UI[code].name
                );
            }
        );

    Object.entries(
        EXTRA_LANGUAGES
    ).forEach(
        ([code, name]) => {

            if (
                !languages.has(
                    code
                )
            ) {

                languages.set(
                    code,
                    name
                );
            }
        }
    );

    languages.set(
        "en",
        "English"
    );

    languages.set(
        "tr",
        "Türkçe"
    );

    [
        ...languages.entries()
    ]
        .sort(
            (a, b) =>
                a[1].localeCompare(
                    b[1]
                )
        )
        .forEach(
            ([code, name]) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    code;

                option.textContent =
                    name;

                languageSelect.appendChild(
                    option
                );
            }
        );

    languageSelect.value =
        base;
}

    toastTimer =

}

function addMessage(
    role,
    content,
    webResults = [],
    claimValidation = null
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {

        welcome.remove();
    }

    document.body.classList.add(
        "chat-active"
    );

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + role;

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar " +
        (
            role === "ai"
                ? "ai"
                : "user"
        );

    if (
        role === "ai"
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.src =
            "logo.png";

        img.alt =
            "Sardis";

        img.onerror =
            function () {

                img.style.display =
                    "none";
            };

        avatar.appendChild(
            img
        );

    } else {

        avatar.textContent =
            "S";
    }

    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";

    const contentDiv =
        document.createElement(
            "div"
        );

    contentDiv.className =
        "message-content";

    contentDiv.textContent =
        safeText(content);

    body.appendChild(
        contentDiv
    );


    /* =====================================================
        VERDICT CHIP
     ====================================================== */

    if (
        role === "ai" &&
        claimValidation &&
        (claimValidation.verdict === "supported" ||
            claimValidation.verdict === "contradicted")
    ) {

        const chip =
            document.createElement(
                "div"
            );

        chip.className =
            "verdict-chip " +
            (claimValidation.verdict === "supported"
                ? "true"
                : "false");

        chip.textContent =
            (claimValidation.verdict === "supported"
                ? "\u2713 "
                : "\u2717 ") +
            t(claimValidation.verdict === "supported"
                ? "verifiedTrue"
                : "verifiedFalse");

        body.appendChild(
            chip
        );
    }


    /* =====================================================
       WEB SOURCES
    ====================================================== */

    if (
        role === "ai" &&
        Array.isArray(webResults) &&
        webResults.length > 0
    ) {

        const validResults =
            webResults.filter(
                result =>
                    result &&
                    result.link
            );

        if (
            validResults.length
        ) {

            const sources =
                document.createElement(
                    "div"
                );

            sources.className =
                "sources";

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "sources-title";

            title.textContent =
                t("sources");

            sources.appendChild(
                title
            );

            validResults
                .slice(0, 10)
                .forEach(
                    result => {

                        const link =
                            document.createElement(
                                "a"
                            );

                        link.className =
                            "source";

                        link.href =
                            result.link;

                        link.target =
                            "_blank";

                        link.rel =
                            "noopener noreferrer";

                        link.textContent =
                            safeText(
                                result.title ||
                                result.name ||
                                result.link
                            );

                        sources.appendChild(
                            link
                        );
                    }
                );

            body.appendChild(
                sources
            );
        }
    }


    /* =====================================================
       META
    ====================================================== */

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    const time =
        document.createElement(
            "span"
        );

    time.textContent =
        getTime();

    meta.appendChild(
        time
    );


    /* =====================================================
       COPY
    ====================================================== */

    if (
        role === "ai"
    ) {

        const copy =
            document.createElement(
                "button"
            );

        copy.type =
            "button";

        copy.className =
            "copy-btn";

        copy.textContent =
            t("copy");

        copy.onclick =
            async function () {

                try {

                    if (
                        navigator.clipboard &&
                        navigator.clipboard.writeText
                    ) {

                        await navigator
                            .clipboard
                            .writeText(
                                safeText(content)
                            );

                    } else {

                        const temp =
                            document.createElement(
                                "textarea"
                            );

                        temp.value =
                            safeText(content);

                        document.body.appendChild(
                            temp
                        );

                        temp.select();

                        document.execCommand(
                            "copy"
                        );

                        temp.remove();
                    }

                    copy.textContent =
                        t("copied");

                    setTimeout(
                        () => {

                            copy.textContent =
                                t("copy");

                        },
                        1500
                    );

                } catch {

                    showToast(
                        t("copyFail")
                    );
                }
            };

        meta.appendChild(
            copy
        );

        attachTtsButton(
            meta,
            safeText(content)
        );
    }

    body.appendChild(
        meta
    );

    message.appendChild(
        avatar
    );

    message.appendChild(
        body
    );

    chatInner.appendChild(
        message
    );

    scrollToBottom();
}

/* =========================================================

========================================================= */

function updateConversation(
    message
) {

    if (!sessionId) {
        return;
    }

    let item =
        conversations.find(
            x =>
                x.id ===
                sessionId
        );

    if (!item) {

        item = {

            id:
                sessionId,

            title:
                safeText(message)
                    .length > 42
                    ? safeText(message)
                        .slice(0, 42) +
                        "..."
                    : safeText(message),

            created:
                Date.now()
        };

        conversations.unshift(
            item
        );
    }

    item.updated =
        Date.now();

    try {

        localStorage.setItem(
            "sardis_conversations",
            JSON.stringify(
                conversations
            )
        );

    } catch {

        /* Storage unavailable */

    }

    renderHistory();
}

   HISTORY
========================================================= */

function renderHistory() {

    if (
        !conversations.length
    ) {

        chatList.innerHTML = `

            <div class="empty-history">
                ${t("empty")}
            </div>

        `;

        return;
    }

    chatList.innerHTML =
        "";

    conversations
        .slice(0, 30)
        .forEach(
            item => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "history-item";

                if (
                    item.id ===
                    sessionId
                ) {

                    button.classList.add(
                        "active"
                    );
                }

                button.textContent =
                    safeText(
                        item.title
                    );

                button.title =
                    safeText(
                        item.title
                    );

                button.onclick =
                    function () {

                        sessionId =
                            item.id;

                        localStorage.setItem(
                            "sardis_session",
                            sessionId
                        );

                        renderHistory();

                        showToast(
                            t("selected")
                        );

                        sidebar.classList.remove(
                            "open"
                        );
                    };

                chatList.appendChild(
                    button
                );
            }
        );

/* =========================================================
   SEND MESSAGE
========================================================= */

/* =========================================================
   SSE V1 — LIVE PROGRESS CONNECTION (auxiliary UI channel)
   /api/chat remains the ONLY answer channel. The EventSource
   is opened lazily on the first meaningful send and re-bound
   when the sessionId changes. Any transport failure falls
   back silently to the existing behavior (PROGRAM AKIŞI is
   then driven by the final /api/chat response alone).
========================================================= */

let sseSource = null;

let sseSession = null;

function sseHandleFrame(payload) {

    try {

        const data =
            JSON.parse(payload);

        if (
            !data ||
            data.sessionId !== sessionId
        ) {
            return;
        }

        if (
            window.SardisActivity &&
            typeof window.SardisActivity.livePhase ===
                "function"
        ) {
            window.SardisActivity.livePhase(
                data.phase
            );
        }

    } catch {
        /* malformed frames are ignored */
    }
}

function sseClose() {

    if (sseSource) {

        try {
            sseSource.close();
        } catch {
            /* ignore */
        }

        sseSource = null;
    }

    sseSession = null;
}

function ensureSseConnection() {

    /* Silent fallback when EventSource is unavailable */
    if (
        typeof window.EventSource !== "function"
    ) {
        return;
    }

    if (!sessionId) {
        return;
    }

    if (
        sseSource &&
        sseSession === sessionId
    ) {
        return;
    }

    sseClose();

    try {

        const source =
            new EventSource(
                "/api/events?sessionId=" +
                encodeURIComponent(sessionId)
            );

        sseSource = source;

        sseSession = sessionId;

        source.addEventListener(
            "progress",
            function (event) {

                if (event.data) {
                    sseHandleFrame(event.data);
                }
            }
        );

        source.addEventListener(
            "done",
            function (event) {

                if (event.data) {
                    sseHandleFrame(event.data);
                }
            }
        );

        source.addEventListener(
            "error",
            function (event) {

                if (event && event.data) {
                    /* server-sent terminal error event;
                       the real answer still comes via /api/chat */
                    return;
                }

                /* Native transport failure — fall back silently.
                   The stream is re-opened on the next send. */
                sseClose();
            }
        );

    } catch {
        sseClose();
    }
}


async function sendMessage() {

    if (isSending) {
        return;
    }

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    isSending =
        true;

    if (
        typeof ttsCancel === "function"
    ) {

        ttsCancel();
    }

    sendBtn.disabled =
        true;

    input.disabled =
        true;

    addMessage(
        "user",
        message
    );

    updateConversation(
        message
    );

    input.value =
        "";

    autoResize();

    showTyping();

    if (
        window.SardisActivity
    ) {
        window.SardisActivity.notifySend(message);

        if (
            typeof window.SardisActivity.liveReset ===
                "function"
        ) {
            window.SardisActivity.liveReset();
        }
    }

    ensureSseConnection();

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            sessionId:
                                sessionId,

                            locale:
                                locale
                        })
                }
            );

        let data;

        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Invalid server response."
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Server error."
            );
        }

        if (
            data.sessionId
        ) {

            sessionId =
                data.sessionId;

            localStorage.setItem(
                "sardis_session",
                sessionId
            );

            ensureSseConnection();

            updateConversation(
                message
            );
        }

        hideTyping();

        const answer =
            data.answer ||
            data.response ||
            data.message ||
            "Sardis could not generate an answer.";

        const results =
            Array.isArray(
                data.webResults
            )
                ? data.webResults
                : (
                    Array.isArray(
                        data.sources
                    )
                        ? data.sources
                        : []
                );

        addMessage(
            "ai",
            answer,
            results,
            data.claimValidation || null
        );

        if (
            window.SardisActivity
        ) {
            window.SardisActivity.handleChatData(
                data
            );
        }

        if (
            data.webSearch ||
            data.webUsed ||
            data.internetUsed
        ) {

            showToast(
                t("web")
            );
        }

    } catch (error) {

        hideTyping();

        const errorMessage =
            error?.message ||
            t("serverError");

        addMessage(
            "ai",
            t("error") +
            "\n\n" +
            errorMessage
        );

        showToast(
            t("serverError")
        );

    } finally {

        isSending =
            false;

        sendBtn.disabled =
            false;

        input.disabled =
            false;

        input.focus();

        scrollToBottom();
    }
}


/* =========================================================
   STATUS
========================================================= */

async function checkStatus() {

    try {

        const response =
            await fetch(
                "/api/status",
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Status unavailable."
            );
        }

        const data =
            await response.json();

        const ollamaOnline =
            data.ollama?.status ===
            "online";

        const modelInstalled =
            data.ollama?.modelInstalled !==
            false;

        const ready =
            ollamaOnline &&
            modelInstalled;

        statusDot.classList.toggle(
            "offline",
            !ready
        );

        statusText.textContent =
            ready
                ? t("ready")
                : t("offline");

        onlineBadge.innerHTML = `

            <span
                class="status-dot ${
                    ready
                        ? ""
                        : "offline"
                }"
            ></span>

            <span id="onlineText">

                ${
                    ready
                        ? t("online")
                        : t("check")
                }

            </span>

        `;

    } catch {

        statusDot.classList.add(
            "offline"
        );

        statusText.textContent =
            t("offline");

        onlineBadge.innerHTML = `

            <span
                class="status-dot offline"
            ></span>

            <span id="onlineText">
                ${t("check")}
            </span>

        `;
    }
}

/* =========================================================
   VOICE INPUT V1 (browser SpeechRecognition)
   Speech → text → user reviews/edits → existing SEND flow.
   Browser-side only; /api/chat untouched. Recognition
   language follows the live user locale (setLocale).
========================================================= */

const micBtn =
    document.getElementById("micBtn");

const micStatus =
    document.getElementById("micStatus");

const MIC_I18N = {

    tr: {
        title: "Sesli giriş",
        listening: "Dinliyor…",
        denied: "Mikrofon izni verilmedi.",
        error: "Ses tanıma başlatılamadı."
    },

    en: {
        title: "Voice input",
        listening: "Listening…",
        denied: "Microphone permission denied.",
        error: "Speech recognition failed."
    }
};

const micSpeechCtor =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition ||
    null;

const micText = function () {
    return MIC_I18N[base] || MIC_I18N.en;
};

let recognition =
    null;

let listening =
    false;

function setMicState(on) {

    listening =
        on;

    if (micBtn) {

        micBtn.classList.toggle(
            "listening",
            on
        );

        micBtn.setAttribute(
            "aria-pressed",
            on ? "true" : "false"
        );
    }

    if (micStatus) {

        micStatus.hidden =
            !on;

        micStatus.textContent =
            on
                ? micText().listening
                : "";
    }
}

if (
    micBtn &&
    micSpeechCtor
) {

    micBtn.hidden =
        false;

    micBtn.title =
        micText().title;

    micBtn.setAttribute(
        "aria-label",
        micText().title
    );

    micBtn.addEventListener(
        "click",
        function () {

            if (listening) {

                if (recognition) {

                    try {
                        recognition.stop();
                    } catch (_) {}
                }

                setMicState(false);

                return;
            }

            recognition =
                new micSpeechCtor();

            recognition.lang =
                locale || "en-US";

            recognition.interimResults =
                true;

            recognition.continuous =
                false;

            recognition.maxAlternatives =
                1;

            const original =
                input.value.trimEnd();

            let finalText =
                "";

            recognition.onstart =
                function () {

                    setMicState(true);
                };

            recognition.onresult =
                function (event) {

                    let interim =
                        "";

                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i++
                    ) {

                        const chunk =
                            event.results[i][0].transcript;

                        if (
                            event.results[i].isFinal
                        ) {

                            finalText =
                                (finalText + " " + chunk)
                                    .trim();

                        } else {

                            interim +=
                                chunk;
                        }
                    }

                    input.value =
                        (
                            (original ? original + " " : "") +
                            (finalText + interim).trimStart()
                        ).trim().slice(
                            0,
                            10000
                        );

                    autoResize();
                };

            recognition.onerror =
                function (event) {

                    setMicState(false);

                    const kind =
                        event.error;

                    if (
                        kind === "aborted" ||
                        kind === "no-speech"
                    ) {
                        return;
                    }

                    showToast(
                        kind === "not-allowed" ||
                        kind === "service-not-allowed"
                            ? micText().denied
                            : micText().error
                    );
                };

            recognition.onend =
                function () {

                    setMicState(false);

                    const end =
                        input.value.length;

                    input.focus();

                    input.setSelectionRange(
                        end,
                        end
                    );
                };

            try {

                recognition.start();

                setMicState(true);

            } catch (_) {

                setMicState(false);

                showToast(
                    micText().error
                );
            }
        }
    );
}


/* =========================================================
   TEXT-TO-SPEECH V1 (browser speechSynthesis)
   Assistant answer → 🔊 button → user-triggered playback.
   No autoplay, no external service; /api/chat untouched.
   Unsupported browsers: feature silently disabled
   (no fake buttons).
========================================================= */

const ttsSupported =
    typeof window !== "undefined" &&
    "speechSynthesis" in window &&
    typeof window.SpeechSynthesisUtterance ===
        "function";

const TTS_I18N = {

    tr: {
        speak: "Sesli oku",
        stop: "Okumayı durdur"
    },

    en: {
        speak: "Read aloud",
        stop: "Stop reading"
    }
};

const ttsLabel = function () {

    return TTS_I18N[base] || TTS_I18N.en;
};

let ttsActiveBtn =
    null;

function ttsResetBtn(btn) {

    if (!btn) {
        return;
    }

    btn.classList.remove(
        "speaking"
    );

    btn.setAttribute(
        "aria-pressed",
        "false"
    );

    btn.title =
        ttsLabel().speak;

    btn.setAttribute(
        "aria-label",
        ttsLabel().speak
    );
}

function ttsCancel() {

    try {

        window.speechSynthesis.cancel();

    } catch (_) {}

    if (ttsActiveBtn) {

        ttsResetBtn(ttsActiveBtn);

        ttsActiveBtn =
            null;
    }
}

function ttsVoiceFor(lang) {

    try {

        const voices =
            window.speechSynthesis.getVoices() || [];

        const target =
            String(lang || "")
                .toLowerCase()
                .replace("_", "-");

        const primary =
            target.split("-")[0];

        return (
            voices.find(
                v =>
                    v.lang &&
                    v.lang.toLowerCase().replace("_", "-") ===
                        target
            ) ||
            voices.find(
                v =>
                    v.lang &&
                    v.lang.toLowerCase().replace("_", "-")
                        .startsWith(primary)
            ) ||
            null
        );

    } catch (_) {

        return null;
    }
}

function attachTtsButton(metaEl, rawText) {

    if (!ttsSupported || !metaEl) {
        return;
    }

    const text =
        String(rawText || "")
            .replace(/\s+/g, " ")
            .trim();

    if (text.length < 2) {
        return;
    }

    const btn =
        document.createElement("button");

    btn.type =
        "button";

    btn.className =
        "tts-btn";

    btn.title =
        ttsLabel().speak;

    btn.setAttribute(
        "aria-label",
        ttsLabel().speak
    );

    btn.setAttribute(
        "aria-pressed",
        "false"
    );

    btn.innerHTML =
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';

    btn.addEventListener(
        "click",
        function () {

            if (ttsActiveBtn === btn) {

                ttsCancel();

                return;
            }

            if (ttsActiveBtn) {

                ttsCancel();
            }

            const utterance =
                new SpeechSynthesisUtterance(text);

            utterance.lang =
                locale || "en-US";

            const voice =
                ttsVoiceFor(utterance.lang);

            if (voice) {

                utterance.voice =
                    voice;
            }

            utterance.onstart =
                function () {

                    ttsActiveBtn =
                        btn;

                    btn.classList.add(
                        "speaking"
                    );

                    btn.setAttribute(
                        "aria-pressed",
                        "true"
                    );

                    btn.title =
                        ttsLabel().stop;

                    btn.setAttribute(
                        "aria-label",
                        ttsLabel().stop
                    );
                };

            utterance.onend =
                function () {

                    if (ttsActiveBtn === btn) {

                        ttsResetBtn(btn);

                        ttsActiveBtn =
                            null;
                    }
                };

            utterance.onerror =
                utterance.onend;

            try {

                window.speechSynthesis.cancel();

                window.speechSynthesis.speak(
                    utterance
                );

            } catch (_) {

                ttsResetBtn(btn);
            }
        }
    );

    metaEl.appendChild(
        btn
    );
}
