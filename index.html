<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sardis AI — Global Premium Assistant</title>

<meta
    name="description"
    content="Sardis AI — Global premium AI assistant"
>

<link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='bold' fill='%23d4af37' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
>

<meta
    name="theme-color"
    content="#000000"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --black: #000000;
    --panel: #070707;
    --panel-2: #0b0b0b;

    --gold-dark: #8a6a16;
    --gold: #c9a227;
    --gold-main: #d4af37;
    --gold-light: #f5d76e;
    --gold-soft: #dfc35b;

    --text: #f5f2e8;
    --text-soft: #d8d2c3;
    --muted: #77736a;

    --border: rgba(212,175,55,.15);

    --sidebar-width: 255px;
    --content-width: 900px;
}

html,
body {
    width: 100%;
    height: 100%;
}

html {
    color-scheme: dark;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);
    background: #000;

    overflow: hidden;
}

button,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 2px solid rgba(212,175,55,.45);
    outline-offset: 2px;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: var(--sidebar-width);
    height: 100%;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            #030303 0%,
            #000000 100%
        );

    border-right:
        1px solid rgba(255,255,255,.07);

    z-index: 20;
}

.brand {
    height: 82px;

    padding: 0 22px;

    display: flex;
    align-items: center;

    gap: 12px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.brand-logo {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
}

.brand-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    /* PNG gövdesine gömülü siyah zeminin kesin kaldırılması:
       luminance mask -> siyah(0)=şeffaf, altın(parlak)=opak.
       logo.png hem görsel hem kendi mask'i; her piksel aynı oranda
       örtüştüğü için yalnızca altın "S" görünür, boyut/konum aynı kalır. */
    -webkit-mask-image:
        url("logo.png");
    -webkit-mask-size:
        contain;
    -webkit-mask-position:
        center;
    -webkit-mask-repeat:
        no-repeat;
    -webkit-mask-mode:
        luminance;

    mask-image:
        url("logo.png");
    mask-size:
        contain;
    mask-position:
        center;
    mask-repeat:
        no-repeat;
    mask-mode:
        luminance;

    display: block;
}

.brand-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.3px;

    color: #eee9dc;
}

.brand-subtitle {
    margin-top: 2px;

    color: #8c7740;

    font-size: 9px;
    letter-spacing: 1.6px;

    font-weight: 600;
}

.new-chat {
    margin: 18px;

    height: 43px;

    border:
        1px solid rgba(212,175,55,.24);

    border-radius: 10px;

    color: #d9bd5c;

    background:
        linear-gradient(
            135deg,
            rgba(212,175,55,.06),
            rgba(212,175,55,.025)
        );

    font-size: 13px;
    font-weight: 600;

    transition:
        background .2s,
        border-color .2s,
        color .2s,
        box-shadow .2s,
        transform .2s;
}

.new-chat:hover {
    color: #fff1a8;

    border-color:
        rgba(212,175,55,.5);

    background:
        rgba(212,175,55,.09);

    box-shadow:
        0 8px 25px rgba(212,175,55,.08);

    transform: translateY(-1px);
}

.sidebar-section {
    padding:
        4px 18px 8px;

    color: #68655e;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.chat-list {
    flex: 1;

    padding: 4px 10px;

    overflow-y: auto;
}

.chat-list::-webkit-scrollbar,
.chat::-webkit-scrollbar {
    width: 5px;
}

.chat-list::-webkit-scrollbar-thumb,
.chat::-webkit-scrollbar-thumb {
    background: rgba(212,175,55,.15);
    border-radius: 999px;
}

.empty-history {
    padding: 25px 10px;

    text-align: center;

    color: #55534d;

    font-size: 12px;

    line-height: 1.6;
}

.history-item {
    width: 100%;

    padding: 10px 11px;

    margin-bottom: 3px;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color: #969188;

    text-align: left;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 12px;

    transition:
        background .15s,
        color .15s;
}

.history-item:hover {
    background:
        rgba(212,175,55,.055);

    color: #ddd5c2;
}

.history-item.active {
    background:
        rgba(212,175,55,.08);

    color: #e3c85e;
}

.sidebar-bottom {
    padding: 15px 18px;

    border-top:
        1px solid rgba(255,255,255,.06);
}

.system-status {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #716e67;

    font-size: 10px;
}

.status-dot {
    width: 7px;
    height: 7px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #c9a227;

    box-shadow:
        0 0 6px rgba(212,175,55,.4);
}

.status-dot.offline {
    background: #8b2929;
    box-shadow: none;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    min-width: 0;

    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    position: relative;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(212,175,55,.025),
            transparent 35%
        ),
        #000;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 26px;

    border-bottom:
        1px solid rgba(255,255,255,.07);

    background:
        rgba(0,0,0,.94);

    /* backdrop-filter kaldırıldı: arkasında sürekli hareket eden
       aurora katmanları yüzünden her karede yeniden blur hesaplanıyor
       ve yazma gecikmesine neden oluyordu. bg zaten %94 opak. */

    z-index: 10;
}

.header-title {
    display: flex;

    align-items: center;

    gap: 10px;
}

.header-title strong {
    color: #eee9dc;

    font-size: 14px;

    font-weight: 650;
}

.online-badge {
    display: flex;

    align-items: center;

    gap: 6px;

    padding: 4px 8px;

    border:
        1px solid rgba(212,175,55,.15);

    border-radius: 999px;

    color: #c9a227;

    background:
        rgba(212,175,55,.035);

    font-size: 9px;
}

.online-badge .status-dot {
    width: 5px;
    height: 5px;
}

.header-right {
    display: flex;

    align-items: center;

    gap: 10px;
}

.language-select {
    max-width: 190px;

    border:
        1px solid rgba(212,175,55,.16);

    border-radius: 8px;

    background: #080808;

    color: #bfb8a7;

    padding: 6px 8px;

    font-size: 10px;

    outline: none;

    cursor: pointer;
}

.language-select:focus {
    border-color:
        rgba(212,175,55,.4);

    box-shadow:
        0 0 0 2px rgba(212,175,55,.05);
}

.model-badge {
    color: #55524b;

    font-size: 10px;

    white-space: nowrap;
}

.mobile-menu {
    display: none;

    border: 0;

    background: transparent;

    color: #c9a227;

    font-size: 21px;
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;

    overflow-y: auto;

    scroll-behavior: smooth;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(212,175,55,.018),
            transparent 42%
        );
}

.chat-inner {
    width:
        min(
            var(--content-width),
            calc(100% - 40px)
        );

    margin: 0 auto;

    padding:
        35px 0 190px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    min-height: 63vh;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.welcome-logo {
    width: 100px;
    height: 100px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 26px;

    background: transparent;
}

.welcome-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    /* PNG gövdesine gömülü siyah zeminin kesin kaldırılması:
       luminance mask -> siyah(0)=şeffaf, altın(parlak)=opak. */
    -webkit-mask-image:
        url("logo.png");
    -webkit-mask-size:
        contain;
    -webkit-mask-position:
        center;
    -webkit-mask-repeat:
        no-repeat;
    -webkit-mask-mode:
        luminance;

    mask-image:
        url("logo.png");
    mask-size:
        contain;
    mask-position:
        center;
    mask-repeat:
        no-repeat;
    mask-mode:
        luminance;

    display: block;
}

.welcome h1 {
    margin-bottom: 11px;

    color: #f3eee0;

    font-size:
        clamp(28px,4vw,40px);

    font-weight: 650;

    letter-spacing: -1.5px;
}

.welcome p {
    max-width: 570px;

    color: #9a9382;

    font-size: 13.5px;

    line-height: 1.85;
}

/* =========================================================
   QUICK PROMPTS
========================================================= */

.quick-prompts {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    max-width: 720px;

    margin-top: 25px;
}

.quick-prompt {
    border:
        1px solid rgba(212,175,55,.14);

    border-radius: 999px;

    padding: 9px 15px;

    background:
        rgba(212,175,55,.03);

    color: #a79f8e;

    font-size: 11px;

    letter-spacing: .2px;

    transition:
        background .2s,
        border-color .2s,
        color .2s,
        transform .2s;
}

.quick-prompt:hover {
    background:
        rgba(212,175,55,.07);

    border-color:
        rgba(212,175,55,.25);

    color: #d4af37;

    transform: translateY(-1px);
}

/* =========================================================
   MESSAGE
========================================================= */

.message {
    display: flex;

    gap: 16px;

    margin-bottom: 30px;

    animation:
        messageIn .2s ease-out;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 9px;

    font-size: 11px;

    font-weight: 800;
}

.avatar.ai {
    overflow: hidden;

    background: transparent;
}

.avatar.ai img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    /* PNG gövdesine gömülü siyah zeminin kesin kaldırılması:
       luminance mask -> siyah(0)=şeffaf, altın(parlak)=opak. */
    -webkit-mask-image:
        url("logo.png");
    -webkit-mask-size:
        contain;
    -webkit-mask-position:
        center;
    -webkit-mask-repeat:
        no-repeat;
    -webkit-mask-mode:
        luminance;

    mask-image:
        url("logo.png");
    mask-size:
        contain;
    mask-position:
        center;
    mask-repeat:
        no-repeat;
    mask-mode:
        luminance;
}

.avatar.user {
    color: #c8c2b3;

    background: #11100c;

    border:
        1px solid rgba(255,255,255,.07);
}

.message-body {
    min-width: 0;

    max-width: 82%;
}

.message.user .message-body {
    max-width: 78%;
}

.message-content {
    padding:
        15px 18px;

    border-radius: 14px;

    font-size: 14px;

    line-height: 1.8;

    white-space: pre-wrap;

    word-break: break-word;
}

.message.ai .message-content {
    background:
        rgba(255,255,255,.03);

    border:
        1px solid rgba(212,175,55,.10);

    color: #eae5d8;

    letter-spacing: .1px;
}

.message.user .message-content {
    background:
        linear-gradient(
            135deg,
            #17150f,
            #12110d
        );

    border:
        1px solid rgba(212,175,55,.09);

    color: #ded8c9;
}

.message-meta {
    margin-top: 6px;

    padding: 0 3px;

    display: flex;

    align-items: center;

    gap: 10px;

    color: #504e48;

    font-size: 9px;
}

.message.user .message-meta {
    justify-content: flex-end;
}

.copy-btn {
    border: 0;

    background: transparent;

    color: #55524c;

    font-size: 9px;

    transition: color .15s;
}

.copy-btn:hover {
    color: #c9a227;
}

/* =========================================================
   SOURCES
========================================================= */

.sources {
    margin-top: 10px;

    padding: 11px;

    border:
        1px solid rgba(212,175,55,.13);

    border-radius: 10px;

    background:
        rgba(212,175,55,.025);
}

.sources-title {
    margin-bottom: 7px;

    color: #c9a227;

    font-size: 10px;

    font-weight: 700;
}

.source {
    display: block;

    padding: 7px 0;

    border-bottom:
        1px solid rgba(255,255,255,.035);

    color: #77736a;

    text-decoration: none;

    font-size: 10px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    transition: color .15s;
}

.source:last-child {
    border-bottom: 0;
}

.source:hover {
    color: #d4af37;
}

/* =========================================================
   TYPING
========================================================= */

.typing {
    display: flex;

    align-items: center;

    gap: 5px;

    padding: 14px 4px;
}

.typing span {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #c9a227;

    animation:
        typing 1.1s infinite ease-in-out;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: .3;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area {
    position: fixed;

    bottom: 0;

    left: var(--sidebar-width);

    right: 0;

    padding:
        18px 25px 22px;

    background:
        linear-gradient(
            to top,
            #000000 55%,
            transparent
        );

    pointer-events: none;

    z-index: 15;
}

.composer {
    pointer-events: auto;

    width:
        min(
            var(--content-width),
            100%
        );

    margin: 0 auto;

    padding: 9px 10px 8px;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 16px;

    background:
        #0a0a0a;

    box-shadow:
        0 8px 28px rgba(0,0,0,.35);
}

.input-row {
    display: flex;

    align-items: flex-end;

    gap: 8px;
}

#messageInput {
    width: 100%;

    min-height: 46px;

    max-height: 180px;

    resize: none;

    border: 0;

    outline: 0;

    background: transparent;

    color: #f0ebdf;

    padding:
        13px 15px;

    font-size: 14px;

    line-height: 1.55;
}

#messageInput::placeholder {
    color: #59564f;
}

#messageInput:disabled {
    opacity: .55;
}

.send-btn {
    width: 43px;
    height: 43px;

    flex-shrink: 0;

    border: 0;

    border-radius: 11px;

    color: #090806;

    font-size: 17px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #927018,
            #d4af37 38%,
            #f4d76d 52%,
            #b4891e 75%,
            #826214
        );

    box-shadow: none;

    transition:
        transform .15s;
}

.send-btn:hover {
    transform: translateY(-1px);
}

.send-btn:disabled {
    opacity: .4;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}

.composer-info {
    padding:
        5px 9px 1px;

    display: flex;

    justify-content: space-between;

    color: #45433e;

    font-size: 9px;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    top: 78px;

    right: 20px;

    max-width: min(360px, calc(100vw - 40px));

    padding:
        10px 13px;

    border:
        1px solid rgba(212,175,55,.16);

    border-radius: 9px;

    background: #15130e;

    color: #d4af37;

    font-size: 10px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);

    opacity: 0;

    transform:
        translateY(-8px);

    pointer-events: none;

    transition:
        opacity .2s,
        transform .2s;

    z-index: 100;
}

.toast.show {
    opacity: 1;

    transform:
        translateY(0);
}

/* =========================================================
   RTL
========================================================= */

[dir="rtl"] .message.user {
    justify-content: flex-start;
}

[dir="rtl"] .message.user .message-body {
    order: 1;
}

[dir="rtl"] .message.user .avatar {
    order: 2;
}

[dir="rtl"] .message.user .message-meta {
    justify-content: flex-start;
}

[dir="rtl"] .history-item {
    text-align: right;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .sidebar {
        position: fixed;

        left: -270px;

        top: 0;
        bottom: 0;

        width: 255px;

        transition: .25s;

        box-shadow:
            20px 0 60px rgba(0,0,0,.7);
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .header {
        padding: 0 15px;
    }

    .model-badge {
        display: none;
    }

    .language-select {
        max-width: 130px;
    }

    .composer-area {
        left: 0;

        padding: 10px;
    }

    .chat-inner {
        width:
            calc(100% - 24px);

        padding-top: 25px;
    }

    .message-body {
        max-width: 88%;
    }

    .message.user .message-body {
        max-width: 86%;
    }

    .welcome {
        min-height: 62vh;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .welcome p {
        padding: 0 10px;

        font-size: 12px;
    }

    .quick-prompts {
        padding: 0 8px;
    }
}

@media (max-width: 500px) {

    .brand {
        height: 70px;
    }

    .welcome-logo {
        width: 72px;
        height: 72px;
    }

    .welcome h1 {
        font-size: 26px;
    }

    .message {
        gap: 8px;
    }

    .avatar {
        width: 29px;
        height: 29px;
    }

    .message-content {
        padding:
            11px 13px;

        font-size: 12px;
    }

    .composer-info span:last-child {
        display: none;
    }

    .language-select {
        max-width: 105px;
    }

    .online-badge {
        display: none;
    }

    .toast {
        right: 10px;
        top: 70px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* =========================================================
   PREMIUM POLISH V5.2
========================================================= */

::selection {
    background:
        rgba(212,175,55,.30);

    color: #fff8dc;
}

/* ---------------------------------------------------------
   AMBIENT AURORA
--------------------------------------------------------- */

.ambient {
    position: absolute;

    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;
}

.ambient::before,
.ambient::after {
    content: "";

    position: absolute;

    width: 52vw;
    height: 52vw;

    min-width: 460px;
    min-height: 460px;

    border-radius: 50%;

    /* Yumuşak ışık: pahalı filter: blur yerine geniş yayılımlı
       radial-gradient. Sıfır blur ve animasyon maliyeti — compositor'a
       yük bindirmez, yazma akıcılığını korur. */
}

.ambient::before {
    top: -20%;
    right: -14%;

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,.13),
            transparent 60%
        );
}

.ambient::after {
    bottom: -26%;
    left: -16%;

    background:
        radial-gradient(
            circle at center,
            rgba(96,130,225,.09),
            transparent 60%
        );
}

.chat {
    position: relative;

    z-index: 1;
}

/* ---------------------------------------------------------
   BRAND & WELCOME
--------------------------------------------------------- */

.brand-name {
    background:
        linear-gradient(
            100deg,
            #f7e9b0 0%,
            #e7c65a 38%,
            #d4af37 55%,
            #a8842a 100%
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;
}

.welcome h1 {
    background:
        linear-gradient(
            100deg,
            #fdf3c4 0%,
            #ecd06a 42%,
            #d4af37 60%,
            #9f7c26 100%
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    letter-spacing: -1px;
}

.welcome-logo {
    animation:
        welcomeIn .55s cubic-bezier(.2,.7,.3,1) both;
}

.welcome p {
    animation:
        welcomeIn .6s cubic-bezier(.2,.7,.3,1) .08s both;
}

.quick-prompts {
    animation:
        welcomeIn .65s cubic-bezier(.2,.7,.3,1) .16s both;
}

@keyframes welcomeIn {

    from {
        opacity: 0;
        transform: translateY(14px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}



/* ---------------------------------------------------------
   STATUS PULSE
--------------------------------------------------------- */

.status-dot:not(.offline) {
    position: relative;
}

/* Nefes alan halka: box-shadow interpolasyonu yerine yalnızca
   opacity animasyonu — tamamen compositor'da çalışır,
   ana thread'e paint yükü bindirmez. Görsel sonuç eşdeğer. */
.status-dot:not(.offline)::after {
    content: "";

    position: absolute;

    inset: -6px;

    border-radius: inherit;

    box-shadow:
        0 0 0 6px rgba(212,175,55,.09);

    opacity: 0;

    pointer-events: none;

    animation:
        dotPulse 2.6s ease-in-out infinite;
}

@keyframes dotPulse {

    0%,
    100% {
        opacity: 0;
    }

    50% {
        opacity: 1;
    }
}

/* ---------------------------------------------------------
   COMPOSER FOCUS GLOW + SEND SHEEN
--------------------------------------------------------- */

.composer {
    transition:
        border-color .18s,
        box-shadow .18s;
}

.composer:focus-within {
    border-color:
        rgba(212,175,55,.45);

    box-shadow:
        0 10px 26px rgba(0,0,0,.38);
}

.send-btn {
    position: relative;

    overflow: hidden;
}

.send-btn::after {
    content: "";

    position: absolute;

    top: 0;
    left: -80%;

    width: 55%;
    height: 100%;

    background:
        linear-gradient(
            105deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transform: skewX(-18deg);

    transition:
        left .5s ease;
}

.send-btn:hover::after {
    left: 130%;
}

.send-btn:disabled::after {
    display: none;
}

/* ---------------------------------------------------------
   MESSAGE ACCENT
--------------------------------------------------------- */

.message.ai .message-content {
    box-shadow:
        inset 2px 0 0 rgba(212,175,55,.26);
}

[dir="rtl"] .message.ai .message-content {
    box-shadow:
        inset -2px 0 0 rgba(212,175,55,.26);
}

/* ---------------------------------------------------------
   VERDICT CHIP (claim verification)
--------------------------------------------------------- */

.verdict-chip {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 8px;

    padding: 4px 10px;

    border-radius: 999px;

    font-size: 9.5px;

    font-weight: 700;

    letter-spacing: .6px;

    text-transform: uppercase;
}

.verdict-chip.true {
    border:
        1px solid rgba(63,167,106,.35);

    background:
        rgba(63,167,106,.09);

    color: #58c98a;
}

.verdict-chip.false {
    border:
        1px solid rgba(214,84,67,.38);

    background:
        rgba(214,84,67,.09);

    color: #ef8a76;
}

/* ---------------------------------------------------------
   MISC
--------------------------------------------------------- */

.quick-prompt {
    background:
        rgba(212,175,55,.05);
}

html {
    scrollbar-color:
        rgba(212,175,55,.22) transparent;
}

</style>

/* =========================================================
   TRANSLATION
========================================================= */

function t(key) {

    return (
        UI[base]?.[key] ??
        UI.en[key] ??
        key
    );
}


/* =========================================================
   SAFE TEXT
========================================================= */

function safeText(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(value);
}


/* =========================================================
   LOCALE
========================================================= */

function setLocale(value) {

    locale =
        value ||
        "en-US";

    base =
        locale
            .toLowerCase()
            .split("-")[0];

    if (
        !UI[base] &&
        !EXTRA_LANGUAGES[base]
    ) {

        base = "en";
    }

    localStorage.setItem(
        "sardis_language",
        locale
    );

    document.documentElement.lang =
        locale;

    document.documentElement.dir =
        RTL_LANGUAGES.has(base)
            ? "rtl"
            : "ltr";

    newChatBtn.textContent =
        t("newChat");

    document.getElementById(
        "chatsLabel"
    ).textContent =
        t("chats");

    const welcomeText =
        document.getElementById(
            "welcomeText"
        );

    if (welcomeText) {

        welcomeText.textContent =
            t("welcome");
    }

    input.placeholder =
        t("placeholder");

    document.getElementById(
        "composerHint"
    ).textContent =
        t("hint");

    document.getElementById(
        "onlineText"
    ).textContent =
        t("online");

    modelBadge.dataset.prefix =
        t("model");

    renderQuickPrompts();

    renderHistory();

    languageSelect.value =
        base;
}


/* =========================================================
   LANGUAGE LIST
========================================================= */

function buildLanguageList() {

    const languages =
        new Map();

    Object.keys(UI)
        .forEach(
            code => {

                languages.set(
                    code,
                    UI[code].name
                );
            }
        );

    Object.entries(
        EXTRA_LANGUAGES
    ).forEach(
        ([code, name]) => {

            if (
                !languages.has(
                    code
                )
            ) {

                languages.set(
                    code,
                    name
                );
            }
        }
    );

    languages.set(
        "en",
        "English"
    );

    languages.set(
        "tr",
        "Türkçe"
    );

    [
        ...languages.entries()
    ]
        .sort(
            (a, b) =>
                a[1].localeCompare(
                    b[1]
                )
        )
        .forEach(
            ([code, name]) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    code;

                option.textContent =
                    name;

                languageSelect.appendChild(
                    option
                );
            }
        );

    languageSelect.value =
        base;
}

/* =========================================================

function showToast(message) {

    toast.textContent =
        safeText(message);

    toast.classList.add(
        "show"

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}

/* =========================================================
   TIME
========================================================= */

function getTime() {

    try {

        return new Date()
            .toLocaleTimeString(
                locale,
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    } catch {

        return new Date()
            .toLocaleTimeString(
                "en-US",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function addMessage(
    role,
    content,
    webResults = [],
    claimValidation = null
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {

        welcome.remove();
    }

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + role;

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar " +
        (
            role === "ai"
                ? "ai"
                : "user"
        );

    if (
        role === "ai"
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.src =
            "logo.png";

        img.alt =
            "Sardis";

        img.onerror =
            function () {

                img.style.display =
                    "none";
            };

        avatar.appendChild(
            img
        );

    } else {

        avatar.textContent =
            "S";
    }

    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";

    const contentDiv =
        document.createElement(
            "div"
        );

    contentDiv.className =
        "message-content";

    contentDiv.textContent =
        safeText(content);

    body.appendChild(
        contentDiv
    );


    /* =====================================================
        VERDICT CHIP
     ====================================================== */

    if (
        role === "ai" &&
        claimValidation &&
        (claimValidation.verdict === "supported" ||
            claimValidation.verdict === "contradicted")
    ) {

        const chip =
            document.createElement(
                "div"
            );

        chip.className =
            "verdict-chip " +
            (claimValidation.verdict === "supported"
                ? "true"
                : "false");

        chip.textContent =
            (claimValidation.verdict === "supported"
                ? "\u2713 "
                : "\u2717 ") +
            t(claimValidation.verdict === "supported"
                ? "verifiedTrue"
                : "verifiedFalse");

        body.appendChild(
            chip
        );
    }


    /* =====================================================
       WEB SOURCES
    ====================================================== */

    if (
        role === "ai" &&
        Array.isArray(webResults) &&
        webResults.length > 0
    ) {

        const validResults =
            webResults.filter(
                result =>
                    result &&
                    result.link
            );

        if (
            validResults.length
        ) {

            const sources =
                document.createElement(
                    "div"
                );

            sources.className =
                "sources";

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "sources-title";

            title.textContent =
                t("sources");

            sources.appendChild(
                title
            );

            validResults
                .slice(0, 10)
                .forEach(
                    result => {

                        const link =
                            document.createElement(
                                "a"
                            );

                        link.className =
                            "source";

                        link.href =
                            result.link;

                        link.target =
                            "_blank";

                        link.rel =
                            "noopener noreferrer";

                        link.textContent =
                            safeText(
                                result.title ||
                                result.name ||
                                result.link
                            );

                        sources.appendChild(
                            link
                        );
                    }
                );

            body.appendChild(
                sources
            );
        }
    }


    /* =====================================================
       META
    ====================================================== */

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    const time =
        document.createElement(
            "span"
        );

    time.textContent =
        getTime();

    meta.appendChild(
        time
    );


    /* =====================================================
       COPY
    ====================================================== */

    if (
        role === "ai"
    ) {

        const copy =
            document.createElement(
                "button"
            );

        copy.type =
            "button";

        copy.className =
            "copy-btn";

        copy.textContent =
            t("copy");

        copy.onclick =
            async function () {

                try {

                    if (
                        navigator.clipboard &&
                        navigator.clipboard.writeText
                    ) {

                        await navigator
                            .clipboard
                            .writeText(
                                safeText(content)
                            );

                    } else {

                        const temp =
                            document.createElement(
                                "textarea"
                            );

                        temp.value =
                            safeText(content);

                        document.body.appendChild(
                            temp
                        );

                        temp.select();

                        document.execCommand(
                            "copy"
                        );

                        temp.remove();
                    }

                    copy.textContent =
                        t("copied");

                    setTimeout(
                        () => {

                            copy.textContent =
                                t("copy");

                        },
                        1500
                    );

                } catch {

                    showToast(
                        t("copyFail")
                    );
                }
            };

        meta.appendChild(
            copy
        );
    }

    body.appendChild(
        meta
    );

    message.appendChild(
        avatar
    );

    message.appendChild(
        body
    );

    chatInner.appendChild(
        message
    );

    scrollToBottom();
}

/* =========================================================
   CONVERSATION
========================================================= */

function updateConversation(
    message
) {

    if (!sessionId) {
        return;
    }

    let item =
        conversations.find(
            x =>
                x.id ===
                sessionId
        );

    if (!item) {

        item = {

            id:
                sessionId,

            title:
                safeText(message)
                    .length > 42
                    ? safeText(message)
                        .slice(0, 42) +
                        "..."
                    : safeText(message),

            created:
                Date.now()
        };

        conversations.unshift(
            item
        );
    }

    item.updated =
        Date.now();

    try {

        localStorage.setItem(
            "sardis_conversations",
            JSON.stringify(
                conversations
            )
        );

    } catch {

        /* Storage unavailable */

    }

    renderHistory();
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {

    if (
        !conversations.length
    ) {

        chatList.innerHTML = `

            <div class="empty-history">
                ${t("empty")}
            </div>

        `;

        return;
    }

    chatList.innerHTML =
        "";

    conversations
        .slice(0, 30)
        .forEach(
            item => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "history-item";

                if (
                    item.id ===
                    sessionId
                ) {

                    button.classList.add(
                        "active"
                    );
                }

                button.textContent =
                    safeText(
                        item.title
                    );

                button.title =
                    safeText(
                        item.title
                    );

                button.onclick =
                    function () {

                        sessionId =
                            item.id;

                        localStorage.setItem(
                            "sardis_session",
                            sessionId
                        );

                        renderHistory();

                        showToast(
                            t("selected")
                        );

                        sidebar.classList.remove(
                            "open"
                        );
                    };

                chatList.appendChild(
                    button
                );
            }
        );
}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (isSending) {
        return;
    }

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    isSending =
        true;

    sendBtn.disabled =
        true;

    input.disabled =
        true;

    addMessage(
        "user",
        message
    );

    updateConversation(
        message
    );

    input.value =
        "";

    autoResize();

    showTyping();

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            sessionId:
                                sessionId,

                            locale:
                                locale
                        })
                }
            );

        let data;

        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Invalid server response."
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Server error."
            );
        }

        if (
            data.sessionId
        ) {

            sessionId =
                data.sessionId;

            localStorage.setItem(
                "sardis_session",
                sessionId
            );

            updateConversation(
                message
            );
        }

        hideTyping();

        const answer =
            data.answer ||
            data.response ||
            data.message ||
            "Sardis could not generate an answer.";

        const results =
            Array.isArray(
                data.webResults
            )
                ? data.webResults
                : (
                    Array.isArray(
                        data.sources
                    )
                        ? data.sources
                        : []
                );

        addMessage(
            "ai",
            answer,
            results,
            data.claimValidation || null
        );

        if (
            data.webSearch ||
            data.webUsed ||
            data.internetUsed
        ) {

            showToast(
                t("web")
            );
        }

    } catch (error) {

        hideTyping();

        const errorMessage =
            error?.message ||
            t("serverError");

        addMessage(
            "ai",
            t("error") +
            "\n\n" +
            errorMessage
        );

        showToast(
            t("serverError")
        );

    } finally {

        isSending =
            false;

        sendBtn.disabled =
            false;

        input.disabled =
            false;

        input.focus();

        scrollToBottom();
    }
}


/* =========================================================
   STATUS
========================================================= */

async function checkStatus() {

    try {

        const response =
            await fetch(
                "/api/status",
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Status unavailable."
            );
        }

        const data =
            await response.json();

        const ollamaOnline =
            data.ollama?.status ===
            "online";

        const modelInstalled =
            data.ollama?.modelInstalled !==
            false;

        const ready =
            ollamaOnline &&
            modelInstalled;

        statusDot.classList.toggle(
            "offline",
            !ready
        );

        statusText.textContent =
            ready
                ? t("ready")
                : t("offline");

        onlineBadge.innerHTML = `

            <span
                class="status-dot ${
                    ready
                        ? ""
                        : "offline"
                }"
            ></span>

            <span id="onlineText">

                ${
                    ready
                        ? t("online")
                        : t("check")
                }

            </span>

        `;

        if (
            data.ollama?.model
        ) {

            modelBadge.textContent =
                t("model") +
                data.ollama.model;
        }

    } catch {

        statusDot.classList.add(
            "offline"
        );

        statusText.textContent =
            t("offline");

        onlineBadge.innerHTML = `

            <span
                class="status-dot offline"
            ></span>

            <span id="onlineText">
                ${t("check")}
            </span>

        `;
    }
}


/* =========================================================
   LANGUAGE CHANGE
========================================================= */

languageSelect.addEventListener(
    "change",
    function () {

        const selected =
            languageSelect.value;

        setLocale(
            selected
        );

        const languageName =
            UI[base]?.name ||
            EXTRA_LANGUAGES[base] ||
            selected;

        showToast(
            t("language") +
            ": " +
            languageName
        );

        input.focus();
    }
);


/* =========================================================
   INPUT
========================================================= */

input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   BUTTONS
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);

newChatBtn.addEventListener(
    "click",
    newChat
);

mobileMenu.addEventListener(
    "click",
    function () {

        sidebar.classList.toggle(
            "open"
        );
    }
);


/* =========================================================
   ESC CLOSE MOBILE SIDEBAR
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            sidebar.classList.remove(
                "open"
            );
        }
    }
);


/* =========================================================
   START
========================================================= */

buildLanguageList();

setLocale(
    locale
);

renderHistory();

checkStatus();

setInterval(
    checkStatus,
    30000
);

autoResize();

input.focus();

</script>

</body>
</html>
